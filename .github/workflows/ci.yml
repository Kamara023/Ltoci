# CI LotoStats — lint + tests Node et Python sur chaque PR et push main.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  node:
    name: Node (lint, build, tests, e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lotostats
          POSTGRES_PASSWORD: lotostats_ci
          POSTGRES_DB: lotostats
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lotostats -d lotostats"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://lotostats:lotostats_ci@localhost:5432/lotostats
      REDIS_URL: redis://localhost:6379
      ML_SERVICE_URL: http://localhost:8000
      ML_SERVICE_TOKEN: ci-ml-token-0000
      INGESTION_SERVICE_URL: http://localhost:8001
      INGESTION_SERVICE_TOKEN: ci-ml-token-0000
      ADMIN_BOOTSTRAP_TOKEN: ci-admin-token-000000
      JWT_ACCESS_SECRET: ci-access-secret-0000000
      JWT_REFRESH_SECRET: ci-refresh-secret-000000
      SEED_ADMIN_EMAIL: ci-admin@lotostats.local
      SEED_ADMIN_PASSWORD: MotDePasseCI!2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations + seed
        working-directory: services/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma generate
          pnpm exec prisma db seed
      - run: pnpm turbo lint build test
      - name: Tests e2e API
        working-directory: services/api
        run: pnpm run test:e2e

  python:
    name: Python ${{ matrix.service }} (ruff, pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ml, ingestion]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
